<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a href="index.html">
      <div class = "title">
        <img src="imagenes/logo.png" alt="Logo de la tienda">
        <h1>Tienda de E-Commerce</h1>
      </div>
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="registro.html">Registro</a></li>
        <li><a href="login.html" id="login">Iniciar sesión</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h2 id="registro">Formulario de registro</h2>
    <form id="registro-form">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="apellido">Apellido:</label>
      <input type="text" id="apellido" name="apellido" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="contraseña">Contraseña:</label>
      <input type="password" id="contraseña" name="contraseña" required>

      <label for="fecha-nacimiento">Fecha de nacimiento:</label>
      <input type="date" id="fecha-nacimiento" name="fecha-nacimiento" required>

      <button type="submit">Registrar</button>
    </form>
  </main>
  <footer>
    <p>&copy; 2025 Tienda de E-Commerce. Todos los derechos reservados.</p>
  </footer>
</body>
</html>
