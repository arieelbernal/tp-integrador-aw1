<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de Compras - Tienda de E-Commerce</title>
  <link rel="icon" type="image/png" href="../../images/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/styles.css">
</head>
<body>
  <header id="main-header">
  </header>

  <main>
    <div class="container">
      <h1 class="page-title">Carrito de Compras</h1>

      <div class="row cart-container g-4">
        <div class="col-12 col-lg-8">
          <div id="cart-items" class="cart-items card p-3 shadow-sm">
          </div>
        </div>

        <div class="col-12 col-lg-4">
          <div class="cart-summary card p-4 shadow-sm">
            <h2 class="h5 border-bottom pb-2 mb-3">Resumen del Pedido</h2>
            <div class="summary-row d-flex justify-content-between mb-2">
              <span>Subtotal:</span>
              <span id="subtotal">$0.00</span>
            </div>
            <div class="summary-row d-flex justify-content-between mb-2">
              <span>Envío:</span>
              <span id="shipping">$0.00</span>
            </div>
            <div class="summary-row total d-flex justify-content-between fs-5 fw-bold border-top pt-3 mt-3">
              <span>Total:</span>
              <span id="total">$0.00</span>
            </div>
            <button id="checkout-btn" class="btn btn-brand-secondary w-100 mt-3">Procesar el pedido</button>
            <a href="../home/home.html" class="continue-shopping d-block text-center mt-3">Continuar Comprando</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer id="main-footer">
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="cart.js"></script>
</body>
</html>
