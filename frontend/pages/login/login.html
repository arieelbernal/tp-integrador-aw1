<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Tienda de E-Commerce</title>
  <link rel="icon" type="image/png" href="../../images/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/styles.css">
</head>
<body>
  <header id="main-header">
  </header>

  <main class="login-container container">
    <div class="card shadow-sm p-4 mx-auto" style="max-width: 460px;">
      <h2 class="h4 text-center mb-4">Iniciar sesión</h2>
      <form id="login-form">
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            placeholder="Ingresa tu correo electrónico"
            required
          >
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="Ingresa tu contraseña"
            required
            minlength="6"
          >
        </div>

        <button type="submit" class="btn btn-brand-secondary w-100">Iniciar sesión</button>

        <div class="register-link text-center mt-3">
          ¿No tienes una cuenta? <a href="../sign-up/sign-up.html">Regístrate aquí</a>
        </div>
      </form>
    </div>
  </main>

  <footer id="main-footer">
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="login.js"></script>
</body>
</html>
