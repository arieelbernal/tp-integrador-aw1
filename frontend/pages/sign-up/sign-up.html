<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Tienda de E-Commerce</title>
  <link rel="icon" type="image/png" href="../../images/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/styles.css">
</head>
<body>
  <header id="main-header">
  </header>

  <main class="signup-container container">
    <div class="card shadow-sm p-4 mx-auto" style="max-width: 560px;">
      <h2 class="h4 text-center mb-4">Crear una cuenta</h2>
      <form id="signup-form">
        <div class="row">
          <div class="col-12 col-sm-6 mb-3">
            <label for="first-name" class="form-label">Nombre</label>
            <input
              type="text"
              id="first-name"
              name="first-name"
              class="form-control"
              placeholder="Tu nombre"
              required
            >
            <div id="first-name-error" class="error-message text-danger small mt-1">Por favor, ingresa tu nombre</div>
          </div>

          <div class="col-12 col-sm-6 mb-3">
            <label for="last-name" class="form-label">Apellido</label>
            <input
              type="text"
              id="last-name"
              name="last-name"
              class="form-control"
              placeholder="Tu apellido"
              required
            >
            <div id="last-name-error" class="error-message text-danger small mt-1">Por favor, ingresa tu apellido</div>
          </div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            placeholder="tucorreo@ejemplo.com"
            required
          >
          <div id="email-error" class="error-message text-danger small mt-1">Por favor, ingresa un correo electrónico válido</div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="Crea una contraseña"
            required
            minlength="6"
          >
          <div id="password-error" class="error-message text-danger small mt-1">La contraseña debe tener al menos 6 caracteres</div>
        </div>

        <div class="mb-3">
          <label for="confirm-password" class="form-label">Confirmar contraseña</label>
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            class="form-control"
            placeholder="Vuelve a escribir tu contraseña"
            required
          >
          <div id="confirm-password-error" class="error-message text-danger small mt-1">Las contraseñas no coinciden</div>
        </div>

        <button type="submit" class="btn btn-brand-secondary w-100">Crear cuenta</button>

        <div class="login-link text-center mt-3">
          ¿Ya tienes una cuenta? <a href="../login/login.html">Inicia sesión</a>
        </div>
      </form>
    </div>
  </main>

  <footer id="main-footer">
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="sign-up.js"></script>
</body>
</html>
