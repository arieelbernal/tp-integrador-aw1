<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Tienda de E-Commerce</title>
  <link rel="stylesheet" href="../../styles/styles.css">
</head>
<body>
  <header id="main-header">
  </header>

  <main class="signup-container">
    <h2>Crear una cuenta</h2>
    <form id="signup-form">
      <div class="form-row">
        <div class="form-group">
          <label for="first-name">Nombre</label>
          <input 
            type="text" 
            id="first-name" 
            name="first-name" 
            placeholder="Tu nombre"
            required
          >
          <div id="first-name-error" class="error-message">Por favor, ingresa tu nombre</div>
        </div>
        
        <div class="form-group">
          <label for="last-name">Apellido</label>
          <input 
            type="text" 
            id="last-name" 
            name="last-name" 
            placeholder="Tu apellido"
            required
          >
          <div id="last-name-error" class="error-message">Por favor, ingresa tu apellido</div>
        </div>
      </div>
      
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="tucorreo@ejemplo.com"
          required
        >
        <div id="email-error" class="error-message">Por favor, ingresa un correo electrónico válido</div>
      </div>
      
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="Crea una contraseña"
          required
          minlength="6"
        >
        <div id="password-error" class="error-message">La contraseña debe tener al menos 6 caracteres</div>
      </div>
      
      <div class="form-group">
        <label for="confirm-password">Confirmar contraseña</label>
        <input 
          type="password" 
          id="confirm-password" 
          name="confirm-password" 
          placeholder="Vuelve a escribir tu contraseña"
          required
        >
        <div id="confirm-password-error" class="error-message">Las contraseñas no coinciden</div>
      </div>
      
      <button type="submit" class="signup-btn">Crear cuenta</button>
      
      <div class="login-link">
        ¿Ya tienes una cuenta? <a href="../login/login.html">Inicia sesión</a>
      </div>
    </form>
  </main>

  <footer id="main-footer">
  </footer>

  <script type="module" src="sign-up.js"></script>
</body>
</html>
